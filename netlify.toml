# Netlify Configuration for Stock Footage Finder

[build]
  # Build command runs in root directory
  command = "npm run build"
  # Publish directory for static frontend assets
  publish = "client/dist"
  # Functions directory
  functions = "netlify/functions"

[build.environment]
  # Ensure Node.js 18+ for modern features
  NODE_VERSION = "18"

# Redirect API calls to Netlify Functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# SPA fallback for React Router (if you add routing later)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Function-specific configuration
[functions]
  # Increase timeout for video/image downloads (default 10s, max 26s on free tier)
  node_bundler = "esbuild"
  included_files = ["downloads/**/*"]

# Headers for security and caching
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization"